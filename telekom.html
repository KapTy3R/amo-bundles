  /* ---------- BLOCK (accordion section) ---------- */
  .block{ padding: 40px 0 8px; border-top: 1px solid var(--divider); }
  .block:first-of-type{ border-top: none; }

  .block-header{
    display:flex;
    align-items: flex-start;
    gap: 14px;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-align: left;
    color: var(--text);
  }
  .block-header:focus-visible{ outline: 2px solid var(--accent); outline-offset: 4px; }

  .block-number{
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    display:flex; align-items:center; justify-content:center;
    margin-top: 2px;
  }
  .block-title-col{ flex: 1; min-width: 0; }
  .block-title{
    font-size: 26px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .block-sub{
    color: var(--text-body);
    font-size: 14.5px;
    margin-top: 8px;
    max-width: 620px;
  }
  .block-chevron{
    flex-shrink:0;
    width: 30px; height: 30px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-body);
    transition: transform .25s ease;
    margin-top: 2px;
  }
  .block.open .block-chevron{ transform: rotate(180deg); }

  .block-body{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .3s ease;
  }
  .block.open .block-body{ grid-template-rows: 1fr; }
  .block-body-inner{ overflow: hidden; }

  .cards{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    padding: 24px 0 8px;
  }
  @media (max-width: 900px){
    .cards{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 620px){
    .cards{ grid-template-columns: 1fr; }
  }

  /* ---------- CARD (product, click to expand UTP) ---------- */
  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 3px solid transparent;
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-left-color .2s ease;
  }
  .card.expanded{ border-left-color: var(--accent); }

  .card-head{
    display:flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    background: none;
    border: none;
    padding: 18px 18px 16px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
  }
  .card-head:focus-visible{ outline: 2px solid var(--accent); outline-offset: -2px; }

  .card-name{
    flex:1;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.35;
  }
  .card-plus{
    flex-shrink:0;
    width: 18px; height: 18px;
    position: relative;
    margin-top: 3px;
  }
  .card-plus::before, .card-plus::after{
    content:"";
    position:absolute;
    background: var(--accent);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    border-radius: 1px;
  }
  .card-plus::before{ width: 12px; height: 2px; }
  .card-plus::after{ width: 2px; height: 12px; transition: transform .22s ease; }
  .card.expanded .card-plus::after{ transform: translate(-50%,-50%) rotate(90deg) scale(0); }

  .card-pain{
    padding: 0 18px 16px;
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--text-body);
    overflow-wrap: anywhere;
  }
  .card-pain-title{
    display: block;
    margin-bottom: 4px;
    font-weight: 700;
    color: var(--accent);
  }
  .card-pain-text{
    display: block;
    white-space: pre-line;
  }

  .card-utp-wrap{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .28s ease;
  }
  .card.expanded .card-utp-wrap{ grid-template-rows: 1fr; }
  .card-utp-inner{ overflow: hidden; }
  .card-utp{
    padding: 0 18px 18px;
    font-size: 13.5px;
    color: var(--text-body);
    white-space: pre-line;
    border-top: 1px solid var(--divider);
    margin: 0 18px;
    padding-left: 0;
    padding-right: 0;
    padding-top: 14px;
  }
  .card-utp-title{
    display: block;
    margin-bottom: 4px;
    font-weight: 700;
    color: var(--text);
  }
  .card-utp-text{
    display: block;
  }

  /* ---------- FOOTER ---------- */
  footer{
    margin-top: 20px;
    padding-top: 24px;
    border-top: 1px solid var(--divider);
    font-size: 12.5px;
    color: var(--text-body);
    display:flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  }

  }

const removeTrailingDots = (text) => text.replace(/\.(?=\s*(?:\n|$))/g, '');

const capitalizeSentenceStarts = (text) => text
  .replace(/(^|\n)([ \t]*(?:-[ \t]*)?)([a-zа-яё])/gimu,
    (_, lineStart, prefix, letter) => `${lineStart}${prefix}${letter.toUpperCase()}`)
  .replace(/([.!?]\s+)([a-zа-яё])/giu,
    (_, sentenceStart, letter) => `${sentenceStart}${letter.toUpperCase()}`);

const formatUtp = (text) => {
  const formatted = text.includes(';')
    ? text
        .split(';')
        .map((part) => part.trim())
        .filter(Boolean)
        .map((part) => `- ${part}`)
        .join('\n')
    : text;

  return removeTrailingDots(capitalizeSentenceStarts(formatted)).replace(/</g,'&lt;');
};

const blocksEl = document.getElementById('blocks');

DATA.forEach((block, bi) => {

  blockEl.className = 'block' + (bi === 0 ? ' open' : '');

  blockEl.innerHTML = `
    <button class="block-header" aria-expanded="${bi===0}">
      <span class="block-number">${bi+1}</span>
      <span class="block-title-col">
        <p class="block-title">${block.title}</p>
      </span>
      <span class="block-chevron">

      </span>
    </button>
    <div class="block-body">
      <div class="block-body-inner">
        <div class="cards"></div>
      </div>
    </div>
  `;

  const cardsWrap = blockEl.querySelector('.cards');
  block.products.forEach((p) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <button class="card-head" aria-expanded="false">
        <span class="card-name">${removeTrailingDots(p.name)}</span>
        <span class="card-plus"></span>
      </button>

        <span class="card-pain-text">${removeTrailingDots(CLIENT_PAINS[p.name]).replace(/</g,'&lt;')}</span>

      <div class="card-utp-wrap">
        <div class="card-utp-inner">

    head.addEventListener('click', () => {

  const header = blockEl.querySelector('.block-header');
  header.addEventListener('click', () => {
    const isOpen = blockEl.classList.toggle('open');
    header.setAttribute('aria-expanded', isOpen);
  });

  blocksEl.appendChild(blockEl);
});
